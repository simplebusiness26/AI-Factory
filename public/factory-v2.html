<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Factory V2</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f6f8}button,input{font:inherit}.shell{width:min(1180px,100%);margin:0 auto;padding:16px}.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a96a3}.top h1{font-size:26px;line-height:1.05;margin:4px 0 6px}.muted{color:#95a0ad;font-size:13px;line-height:1.45}.btn{border:1px solid #2e3742;background:#151a20;color:#fff;border-radius:10px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{grid-column:span 12;background:#11151a;border:1px solid #252c34;border-radius:14px;padding:14px;min-width:0}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#aeb7c2;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:#0c1014;border:1px solid #212832;border-radius:11px;padding:12px}.stat strong{display:block;font-size:24px}.stat span{display:block;color:#8793a0;font-size:11px;margin-top:2px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #20262d}.row:first-of-type{border-top:0}.name{font-weight:650;font-size:14px}.meta{font-size:12px;color:#8995a2;margin-top:3px;overflow-wrap:anywhere}.pill{font-size:10px;text-transform:uppercase;letter-spacing:.08em;border:1px solid #38424d;padding:5px 7px;border-radius:999px;white-space:nowrap}.ready{border-color:#28573d;color:#84e2a7}.limited,.approval_required{border-color:#6a5425;color:#edca74}.not_ready,.blocked,.failed{border-color:#693038;color:#ff919d}.queued,.running,.verifying{border-color:#365978;color:#8bc8ff}.completed{border-color:#28573d;color:#84e2a7}.order{background:#0d1115;border:1px solid #222a33;border-radius:11px;padding:12px;margin-top:8px}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order h3{font-size:14px;margin:0}.route{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.route span{font-size:10px;background:#151b22;border:1px solid #28313b;border-radius:7px;padding:5px 7px}.warning{margin-top:9px;font-size:12px;color:#ff9ca6}.auth{position:fixed;inset:0;background:rgba(5,7,9,.92);display:grid;place-items:center;padding:20px;z-index:5}.auth-box{width:min(420px,100%);background:#11161b;border:1px solid #2b333d;border-radius:16px;padding:18px}.auth h2{margin:0 0 7px}.auth input{width:100%;margin:14px 0 10px;padding:12px;border-radius:10px;border:1px solid #35404c;background:#090c10;color:#fff}.hidden{display:none!important}@media(min-width:760px){.shell{padding:24px}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.command{grid-column:span 5}.floor{grid-column:span 7}.work{grid-column:span 12}.top h1{font-size:32px}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"><div class="auth-box"><div class="eyebrow">Protected control surface</div><h2>Open Factory V2</h2><p class="muted">Use the same AI Factory write key already configured in Cloudflare. It stays in this browser session only.</p><input id="key" type="password" autocomplete="current-password" placeholder="AI_FACTORY_KEY"><button id="unlock" class="btn" style="width:100%">Unlock Factory</button><p id="authError" class="warning"></p></div></div>
<main class="shell">
<header class="top"><div><div class="eyebrow">Execution engine</div><h1>AI Factory V2</h1><div id="authority" class="muted">Operating System → approved work orders → verified execution</div></div><button id="refresh" class="btn">Refresh</button></header>
<section class="grid">
<div class="card command"><h2>Command</h2><div id="stats" class="stats"></div><div id="autonomy" class="muted" style="margin-top:12px"></div></div>
<div class="card floor"><h2>Factory floor</h2><div id="capabilities"></div></div>
<div class="card work"><h2>Execution queue</h2><div id="orders"></div></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);let key=sessionStorage.getItem('ai_factory_key')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showAuth(msg=''){ $('#auth').classList.remove('hidden');$('#authError').textContent=msg; }
async function api(path){const r=await fetch(path,{headers:{'x-ai-factory-key':key}});if(r.status===401){showAuth('That key was not accepted.');throw new Error('unauthorized')}if(!r.ok)throw new Error(`Request failed: ${r.status}`);return r.json()}
function pill(status){return `<span class="pill ${esc(status)}">${esc(status).replaceAll('_',' ')}</span>`}
function render(data){
 $('#authority').textContent=data.authority;
 const order=['queued','running','blocked','verifying','completed','failed'];
 $('#stats').innerHTML=order.map(k=>`<div class="stat"><strong>${data.counts[k]||0}</strong><span>${k}</span></div>`).join('');
 $('#autonomy').innerHTML=`Autonomy: <strong>Level ${data.autonomy.level} — ${esc(data.autonomy.name)}</strong>. Merge: ${data.autonomy.mayMerge?'allowed':'blocked'} · Production deploy: ${data.autonomy.mayDeployProduction?'allowed':'blocked'}.`;
 $('#capabilities').innerHTML=data.capabilities.map(c=>`<div class="row"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.kind)} · ${esc(c.notes)}</div></div><div style="text-align:right">${pill(c.status)}<div class="meta">${c.readiness}%</div></div></div>`).join('');
 $('#orders').innerHTML=data.workOrders.length?data.workOrders.map(w=>`<div class="order"><div class="order-head"><div><h3>${esc(w.project_name||w.projectName||'Unassigned')} — ${esc(w.objective)}</h3><div class="meta">${esc(w.id)} · source: ${esc(w.source_system||w.sourceSystem)} · priority ${esc(w.priority)}</div></div>${pill(w.status)}</div><div class="route">${(w.execution_route||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div>${w.blocked_reason?`<div class="warning">${esc(w.blocked_reason)}</div>`:''}</div>`).join(''):'<p class="muted">No work orders yet. Once the Operating System dispatches an approved order it will appear here.</p>';
}
async function load(){try{render(await api('/api/v2/dashboard'))}catch(e){if(e.message!=='unauthorized')$('#orders').innerHTML=`<p class="warning">${esc(e.message)}</p>`}}
$('#unlock').onclick=()=>{key=$('#key').value.trim();sessionStorage.setItem('ai_factory_key',key);$('#auth').classList.add('hidden');load()};
$('#refresh').onclick=load;if(!key)showAuth();else load();
</script>
</body></html>
